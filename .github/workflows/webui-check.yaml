name: WebUI checks

on:
  workflow_call:
    inputs:
      development_build:
        type: boolean
        default: false
      dev_base_version:
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.check.outputs.version }}
  workflow_dispatch:
    inputs:
      dev_base_version:
        description: 'Development base X.Y.Z; blank uses the SDK version without rc suffix'
        type: string
        default: ''
  push:
    branches: [main, 'release/**', 'feat/**', 'fix/**']
    paths: ['ms_agent/**', 'webui/**', 'requirements/**', 'tests/cli/**', 'tests/ui/**', 'tests/release/**', '.dev_scripts/webui/**', 'setup.py', 'setup.cfg', 'MANIFEST.in', 'README*', '.github/workflows/webui-*.yaml', '.github/workflows/publish.yaml']
  pull_request:
    paths: ['ms_agent/**', 'webui/**', 'requirements/**', 'tests/cli/**', 'tests/ui/**', 'tests/release/**', '.dev_scripts/webui/**', 'setup.py', 'setup.cfg', 'MANIFEST.in', 'README*', '.github/workflows/webui-*.yaml', '.github/workflows/publish.yaml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose the package version
        id: package-version
        env:
          DEVELOPMENT_BUILD: ${{ github.event_name == 'workflow_dispatch' || inputs.development_build }}
          DEV_BASE_VERSION: ${{ inputs.dev_base_version }}
        run: |
          if test "$DEVELOPMENT_BUILD" = true; then
            python .dev_scripts/webui/development_version.py --build-id "$GITHUB_RUN_ID" \
              --base-version "$DEV_BASE_VERSION" --github-output
          fi
      - name: Set the expected development version
        env:
          EXPECTED_VERSION: ${{ steps.package-version.outputs.package_version }}
        run: echo "PACKAGE_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
      - name: Find original packages from an earlier attempt
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .dev_scripts/webui/release_artifacts.py find --name webui-release-inputs
      - uses: actions/download-artifact@v4
        if: steps.original.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.original.outputs.artifact_id }}
          merge-multiple: true
          path: release-inputs
      - name: Verify original package bytes
        if: steps.original.outputs.artifact_id != ''
        run: |
          (cd release-inputs && sha256sum --check SHA256SUMS)
          python .dev_scripts/webui/check_webui_release.py --dist release-inputs --sdk-sha "$GITHUB_SHA" --package-version "$PACKAGE_VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.8'
      - name: Check source and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          echo "MS_AGENT_HOME=$RUNNER_TEMP/ms-agent-check-home" >> "$GITHUB_ENV"
          python .dev_scripts/webui/check_webui_release.py --tag "$RELEASE_TAG"
      - name: Install backend test dependencies
        if: steps.original.outputs.artifact_id == ''
        run: |
          uv sync --project webui/backend --locked --inexact --extra local-embed
      - name: Install frontend tools for launcher tests
        if: steps.original.outputs.artifact_id == ''
        run: pnpm --dir webui/frontend install --frozen-lockfile
      - name: Backend regression tests
        if: steps.original.outputs.artifact_id == ''
        working-directory: webui/backend
        run: .venv/bin/python -X faulthandler -m pytest -q
      - name: SDK and release regression tests
        if: steps.original.outputs.artifact_id == ''
        env:
          MODELSCOPE_RUN_REMOTE_TESTS: 'false'
        run: |
          webui/backend/.venv/bin/python -X faulthandler -m pytest tests/cli tests/ui tests/release -q
          webui/backend/.venv/bin/python -X faulthandler -m pytest tests/agent_hub -q
      - name: Frontend types, CSS and SSR build
        if: steps.original.outputs.artifact_id == ''
        env:
          DEV_BASE_VERSION: ${{ inputs.dev_base_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/ms-agent-package-source"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/ms-agent-package-source"
          if test -n "$PACKAGE_VERSION"; then
            python .dev_scripts/webui/development_version.py --build-id "$GITHUB_RUN_ID" \
              --base-version "$DEV_BASE_VERSION" --source "$RUNNER_TEMP/ms-agent-package-source" --apply
          fi
          cd "$RUNNER_TEMP/ms-agent-package-source"
          pnpm --dir webui/frontend install --frozen-lockfile
          pnpm --dir webui/frontend typecheck
          python .dev_scripts/webui/prepare_webui.py --sdk-sha "$GITHUB_SHA"
      - name: Build wheel and sdist with locked runtime requirements
        if: steps.original.outputs.artifact_id == ''
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-inputs"
          cd "$RUNNER_TEMP/ms-agent-package-source"
          uv export --project webui/backend --frozen --no-dev --no-emit-project --no-emit-package ms-agent --output-file "$GITHUB_WORKSPACE/release-inputs/runtime-requirements.txt" > /dev/null
          uv build --python 3.12 --out-dir "$GITHUB_WORKSPACE/release-inputs"
          cd "$GITHUB_WORKSPACE"
          uvx --from twine==6.2.0 twine check release-inputs/*.whl release-inputs/*.tar.gz
          python .dev_scripts/webui/check_webui_release.py --dist release-inputs --sdk-sha "$GITHUB_SHA" --package-version "$PACKAGE_VERSION"
      - name: Rebuild sdist without frontend tools
        if: steps.original.outputs.artifact_id == ''
        run: |
          mkdir -p "$RUNNER_TEMP/no-frontend-tools"
          for tool in node pnpm; do
            printf '#!/bin/sh\necho Unexpected frontend rebuild >&2\nexit 99\n' > "$RUNNER_TEMP/no-frontend-tools/$tool"
            chmod +x "$RUNNER_TEMP/no-frontend-tools/$tool"
          done
          PATH="$RUNNER_TEMP/no-frontend-tools:$PATH" uv build --wheel --python 3.12 release-inputs/*.tar.gz --out-dir "$RUNNER_TEMP/sdist-wheel"
      - name: Install and exercise the wheel outside the checkout
        if: steps.original.outputs.artifact_id == ''
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/webui-wheel"
          uv pip install --python "$RUNNER_TEMP/webui-wheel/bin/python" --require-hashes --no-deps -r release-inputs/runtime-requirements.txt
          uv pip install --python "$RUNNER_TEMP/webui-wheel/bin/python" --no-deps release-inputs/*.whl
          uv pip check --python "$RUNNER_TEMP/webui-wheel/bin/python"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/webui-wheel/bin/python" "$GITHUB_WORKSPACE/.dev_scripts/webui/check_webui_install.py" --logs "$RUNNER_TEMP/webui-logs"
      - id: metadata
        name: Record package version
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release-inputs/release.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + release['version'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.original.outputs.artifact_id == ''
        with:
          name: webui-release-inputs
          path: release-inputs/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webui-install-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webui-logs/
          if-no-files-found: ignore
